{% extends 'base.html' %}

{% block title %}Add Patient - HospitalMS{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body p-5">
                        <h1 class="card-title mb-2">➕ Add New Patient</h1>
                        <p class="text-muted mb-4">Fill in the form below to register a new patient</p>
                        
                        <form method="post" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                {{ form.as_p }}
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1">Add Patient</button>
                                <a href="/view-patients/" class="btn btn-secondary flex-grow-1">Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
